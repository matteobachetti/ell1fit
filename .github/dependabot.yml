# Keep the GitHub Actions used by the workflows up to date. Dependabot opens a
# pull request when a new version of an action comes out, so runtime
# deprecations (such as the move from Node.js 20 to 24) are caught early.
# All updates are grouped into a single weekly pull request.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
