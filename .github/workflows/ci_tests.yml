# GitHub Actions workflow for testing and continuous integration.
#
# This file performs testing using tox and tox.ini to define and configure the test environments.

name: CI Tests

on:
  push:
    branches:
    - main  # GitHub now defaults to 'main' as the name of the primary branch. Change this as needed.
  #  tags: # run CI if specific tags are pushed
  pull_request:
    # branches: # only build on PRs against 'main' if you need to further limit when CI is run.
    #    - main

jobs:
  # Github Actions supports ubuntu, windows, and macos virtual environments:
  # https://help.github.com/en/actions/reference/virtual-environments-for-github-hosted-runners
  ci_tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: Code style checks
            os: ubuntu-latest
            python: 3.x
            toxenv: codestyle

          - name: Python 3.11 with minimal dependencies
            os: ubuntu-latest
            python: 3.11
            toxenv: py311-test

          - name: Python 3.12 with all optional dependencies and coverage checking
            os: ubuntu-latest
            python: 3.12
            toxenv: py312-test-alldeps-cov

          - name: Python 3.13 with all optional dependencies and coverage checking
            os: ubuntu-latest
            python: 3.13
            toxenv: py313-test-alldeps-cov

          # Tests marked @pytest.mark.slow are skipped by the jobs above and
          # run here instead, split into two jobs of about the same length that
          # run in parallel with the rest. Every test reading one of the
          # module-level fixtures of test_orbital_decay.py lands in the first,
          # so no fixture is built twice.
          - name: Slow tests (orbital decay), Python 3.13, all optional dependencies, coverage
            os: ubuntu-latest
            python: 3.13
            toxenv: py313-test-alldeps-cov
            toxargs: -m slow --run-slow -k orbital_decay

          - name: Slow tests (all others), Python 3.13, all optional dependencies, coverage
            os: ubuntu-latest
            python: 3.13
            toxenv: py313-test-alldeps-cov
            toxargs: -m slow --run-slow -k 'not orbital_decay'

          - name: macOS - Python 3.11 with all optional dependencies
            os: macos-latest
            python: 3.11
            toxenv: py311-test-alldeps

          - name: Windows - Python 3.11 with all optional dependencies
            os: windows-latest
            python: 3.11
            toxenv: py311-test-alldeps

          # Builds the HTML documentation with warnings treated as errors, so a
          # malformed docstring or a broken cross-reference fails the build
          # rather than silently degrading the rendered docs. The examples in
          # docs/*.rst are executed separately, by the test environments above.
          - name: Documentation build
            os: ubuntu-latest
            python: 3.12
            toxenv: build_docs

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Set up python ${{ matrix.python }} on ${{ matrix.os }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Test with tox
      run: |
        tox -e ${{ matrix.toxenv }} -- ${{ matrix.toxargs }}
    # This is an example of how to upload coverage to codecov
    # - name: Upload coverage to codecov
    #   if: "contains(matrix.toxenv, '-cov')"
    #   uses: codecov/codecov-action@v2
    #   with:
    #     file: ./coverage.xml
