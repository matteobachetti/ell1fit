[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ell1fit"
dynamic = ["version"]
description = "Fit an ELL1 orbital model to pulsar data, accounting for spin derivatives"
readme = "README.rst"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Matteo Bachetti", email = "matteo@matteobachetti.it"}
]
requires-python = ">=3.11"
dependencies = [
    "astropy",
    "emcee",
    "matplotlib",
    "pint-pulsar",
    "numba",
    "scipy",
    "corner",
    "stingray",
    "hendrics",
    "colorama",
    "netcdf4",
    "h5py",
    "pyyaml",
    "scinum",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-astropy",
    "pytest-cov",
]
docs = [
    "sphinx",
    "sphinx-astropy",
]

[project.scripts]
ell1fit = "ell1fit.ell1fit:main"
ell1par = "ell1fit.create_parfile:main"
ell1updatebinary = "ell1fit.update_binary:main"

[project.urls]
Homepage = "http://github.com/matteobachetti/ell1fit"
Repository = "http://github.com/matteobachetti/ell1fit"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ell1fit*"]

[tool.setuptools.package-data]
"ell1fit" = ["data/*"]
"ell1fit.tests" = ["data/*"]

[tool.setuptools_scm]
write_to = "src/ell1fit/version.py"

[tool.pytest.ini_options]
testpaths = ["src/ell1fit", "docs"]
# --doctest-glob is what makes the examples in docs/*.rst run as tests. The
# older --doctest-rst spelling is a silent no-op in current pytest-doctestplus,
# so the documentation examples were never actually being executed.
addopts = "--doctest-glob=*.rst"
text_file_format = "rst"

[tool.coverage.run]
omit = [
    "src/ell1fit/conftest.py",
    "src/ell1fit/tests/*",
    "src/ell1fit/version*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except ImportError",
    "raise AssertionError",
    "raise NotImplementedError",
    "def main\\(.*\\):",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
# Keep a minimal, flake8-like rule surface.
