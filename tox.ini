[tox]
envlist =
    py{311,312,313}-test{,-alldeps,-devdeps}{,-cov}
    build_docs
    linkcheck
    codestyle
requires =
    setuptools >= 30.3.0
    pip >= 19.3.1
isolated_build = true
indexserver =
    NIGHTLY = https://pypi.anaconda.org/scipy-wheels-nightly/simple

[testenv]
# Suppress display of matplotlib plots generated during docs build
setenv = MPLBACKEND=agg

# Pass through the following environment variables which may be needed for the CI
passenv = HOME,WINDIR,LC_ALL,LC_CTYPE,CC,CI,TRAVIS

# Run the tests in a temporary directory to make sure that we don't import
# this package from the source tree
changedir = .tmp/{envname}

# tox environments are constructed with so-called 'factors' (or terms)
# separated by hyphens, e.g. test-devdeps-cov. Lines below starting with factor:
# will only take effect if that factor is included in the environment name. To
# see a list of example environments that can be run, along with a description,
# run:
#
#     tox -l -v
#
description =
    run tests
    alldeps: with all optional dependencies
    devdeps: with the latest developer version of key dependencies
    cov: and test coverage

# The following provides some specific pinnings for key packages
deps =

    cov: coverage

    devdeps: :NIGHTLY:numpy
    devdeps: git+https://github.com/astropy/astropy.git#egg=astropy

# The following indicates which project optional dependencies will be installed
extras =
    test
    alldeps: docs
    alldeps: nested
    alldeps: nuts

commands =
    pip freeze
    !cov: pytest --pyargs ell1fit {toxinidir}/docs {posargs}
    cov: pytest --pyargs ell1fit {toxinidir}/docs --cov ell1fit --cov-config={toxinidir}/pyproject.toml {posargs}
    cov: coverage xml -o {toxinidir}/coverage.xml

[testenv:build_docs]
changedir = docs
description = invoke sphinx-build to build the HTML docs
# The package is installed *without* its dependencies, which are listed below
# instead -- minus numba. Building the docs requires importing every module, but
# never running a fit, and ell1fit._numba_compat supplies no-op decorators when
# numba is absent. Leaving it out keeps llvmlite out too, whose build is a
# recurring source of failures that have nothing to do with documentation (most
# often no wheel yet for a newly released Python).
#
# The list below is [project.dependencies] from pyproject.toml, minus numba. Add
# a dependency there and forget it here and this build fails loudly, with an
# ImportError naming the module.
skip_install = true
deps =
    sphinx
    sphinx-astropy
    astropy
    colorama
    corner
    emcee
    h5py
    hendrics
    matplotlib
    netcdf4
    pint-pulsar
    pyyaml
    scinum
    scipy
    stingray
commands =
    pip install --no-deps {toxinidir}
    pip freeze
    sphinx-build -W -b html . _build/html

[testenv:linkcheck]
changedir = docs
description = check the links in the HTML docs
extras = docs
commands =
    pip freeze
    sphinx-build -W -b linkcheck . _build/html

[testenv:codestyle]
skip_install = true
changedir = .
description = check code style with minimal ruff rules (flake8-equivalent)
deps = ruff
commands =
    ruff check src/ell1fit tools
    ruff format --check src/ell1fit tools
